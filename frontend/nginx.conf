# Kathputli SPA and API gateway. Backend services listen on port 8080.
server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # More-specific cross-service routes must precede general artist/order routes.
    location ~ ^/api/artists/[^/]+/(categories|artworks)(/.*)?$ {
        proxy_pass http://artwork-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/api/orders/[^/]+/payment$ {
        proxy_pass http://payment-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth          { proxy_pass http://auth-service:8080;         proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/users         { proxy_pass http://user-service:8080;         proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/artists       { proxy_pass http://artist-service:8080;       proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/artworks      { proxy_pass http://artwork-service:8080;      proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/orders        { proxy_pass http://order-service:8080;        proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/payments      { proxy_pass http://payment-service:8080;      proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/deliveries    { proxy_pass http://delivery-service:8080;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/notifications { proxy_pass http://notification-service:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
